<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — Herbal Harmony with Holistic Healing</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root{ --neon:#528552; --forest:#3d5a3d; --cream:#F8F4E9; --cream-dark:#CDCFC0; --charcoal:#3B575A; --sage-dark:#9F9989; --red:#c0392b; }
        *{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:"Montserrat",sans-serif;background:var(--cream);color:var(--charcoal);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;}
        .card{background:#fff;border:1px solid var(--cream-dark);border-radius:1.25rem;box-shadow:0 4px 24px rgba(61,90,61,0.08);max-width:440px;width:100%;padding:2.5rem 2rem;text-align:center;}
        .brand{font-size:0.66rem;font-weight:700;letter-spacing:0.24em;text-transform:uppercase;color:var(--neon);margin-bottom:0.75rem;}
        h1{font-family:"Cormorant Garamond",serif;font-size:1.9rem;color:var(--forest);margin-bottom:0.5rem;line-height:1.2;}
        p.lead{font-size:0.85rem;line-height:1.55;color:var(--sage-dark);margin-bottom:1.5rem;}
        label{display:block;text-align:left;font-size:0.72rem;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;color:var(--charcoal);margin-bottom:0.4rem;}
        input{width:100%;padding:0.8rem 1rem;border:1px solid var(--cream-dark);border-radius:0.6rem;font-size:0.95rem;font-family:inherit;color:var(--charcoal);margin-bottom:1.2rem;}
        input:focus{outline:none;border-color:var(--neon);}
        button{width:100%;background:var(--neon);color:#fff;border:none;border-radius:999px;padding:0.85rem;font-size:0.95rem;font-weight:600;font-family:inherit;cursor:pointer;transition:background .2s;}
        button:hover{background:var(--forest);}
        button:disabled{opacity:0.6;cursor:default;}
        .msg{font-size:0.85rem;line-height:1.5;margin-top:1.2rem;padding:0.85rem 1rem;border-radius:0.6rem;display:none;}
        .msg.show{display:block;}
        .msg.ok{background:rgba(82,133,82,0.12);color:var(--forest);}
        .msg.err{background:rgba(192,57,43,0.10);color:var(--red);}
        .back{display:inline-block;margin-top:1.4rem;font-size:0.8rem;color:var(--neon);text-decoration:none;}
        .back:hover{text-decoration:underline;}
    </style>
</head>
<body>
<div class="card">
    <div class="brand">Herbal Harmony</div>
    <h1>Choose a new password</h1>
    <p class="lead">Enter a new password for your account. It must be at least 8 characters.</p>
    <form id="reset-form">
        <label for="password">New password</label>
        <input type="password" id="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters">
        <label for="confirm">Confirm new password</label>
        <input type="password" id="confirm" required minlength="8" autocomplete="new-password" placeholder="Re-enter your password">
        <button type="submit" id="submit-btn">Reset password</button>
    </form>
    <div class="msg" id="msg"></div>
    <a class="back" href="login.html">&larr; Back to log in</a>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const email = params.get('email');
    const form  = document.getElementById('reset-form');
    const btn   = document.getElementById('submit-btn');
    const msg   = document.getElementById('msg');

    // If the link is missing its token or email, don't even show the form.
    if (!token || !email) {
        form.style.display = 'none';
        msg.textContent = 'This reset link is incomplete or invalid. Please request a new one from the Forgot Password page.';
        msg.className = 'msg err show';
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const password = document.getElementById('password').value;
        const confirm  = document.getElementById('confirm').value;
        msg.className = 'msg';

        if (password.length < 8) {
            msg.textContent = 'Password must be at least 8 characters.';
            msg.classList.add('err', 'show');
            return;
        }
        if (password !== confirm) {
            msg.textContent = "Those passwords don't match. Please try again.";
            msg.classList.add('err', 'show');
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Resetting…';
        try {
            const res = await fetch('/.netlify/functions/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, token, password })
            });
            const data = await res.json();
            if (res.ok) {
                msg.textContent = data.message || 'Your password has been reset. You can now log in.';
                msg.classList.add('ok', 'show');
                form.style.display = 'none';
            } else {
                msg.textContent = data.error || 'Something went wrong. Please try again.';
                msg.classList.add('err', 'show');
                btn.disabled = false;
                btn.textContent = 'Reset password';
            }
        } catch (err) {
            msg.textContent = 'Network error. Please try again.';
            msg.classList.add('err', 'show');
            btn.disabled = false;
            btn.textContent = 'Reset password';
        }
    });
</script>
</body>
</html>
